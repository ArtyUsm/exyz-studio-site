/* ---------- canvas / scaling ---------- */
var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var view={s:1,ox:0,oy:0,w:0,h:0,dpr:1};
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=window.innerWidth,h=window.innerHeight;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px";
  view.dpr=dpr; view.w=w; view.h=h;
  view.s=Math.min(w/CFG.W,h/CFG.H);
  view.ox=(w-CFG.W*view.s)/2; view.oy=(h-CFG.H*view.s)/2;
}
window.addEventListener("resize",resize); window.addEventListener("orientationchange",function(){setTimeout(resize,100)}); resize();

/* ---------- image loading ---------- */
var IMG={}, toLoad=0;
Object.keys(ASSETS).forEach(function(k){
  toLoad++; var im=new Image(); im.onload=im.onerror=function(){ if(--toLoad===0) init(); }; im.src=ASSETS[k]; IMG[k]=im;
});
function drawImg(name,x,y,w,h,rot,alpha){
  var im=IMG[name]; if(!im||!im.width) return;
  if(h===undefined) h=w*im.height/im.width;
  ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot); if(alpha!==undefined) ctx.globalAlpha*=alpha;
  ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore();
}

/* ---------- audio (tiny synth, no files) ---------- */
var AC=null, muted=false;
function audioInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f,dur,type,vol,slide){
  if(!AC||muted) return; var o=AC.createOscillator(),g=AC.createGain(); o.type=type||"sine"; o.frequency.value=f;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.2,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}
var SFX={
  shoot:function(){ tone(520,0.12,"triangle",0.15,880); },
  pop:function(i){ tone(600+i*60,0.14,"sine",0.18,300); },
  snap:function(){ tone(220,0.06,"square",0.06); },
  boom:function(){ tone(120,0.5,"sawtooth",0.25,40); },
  zap:function(){ tone(1400,0.3,"square",0.12,200); },
  win:function(){ [0,120,240,360].forEach(function(d,i){ setTimeout(function(){tone(523*Math.pow(1.26,i),0.3,"triangle",0.2)},d); }); },
  fail:function(){ tone(300,0.6,"sawtooth",0.15,120); }
};

/* ---------- helpers ---------- */
var rowH=CFG.R*Math.sqrt(3), boardLeft=(CFG.W-CFG.cols*CFG.R*2)/2, boardTop=200;
function cellX(r,c){ return boardLeft+CFG.R+c*CFG.R*2+(r%2)*CFG.R; }
function cellY(r){ return boardTop+CFG.R+r*rowH; }
function rowCols(r){ return CFG.cols-(r%2); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOut(t){ return 1-Math.pow(1-t,3); }
function easeOutBack(t){ var s=1.7; return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2); }
function neighbors(r,c){
  var odd=r%2, list=[[r,c-1],[r,c+1],[r-1,c],[r+1,c]];
  if(odd){ list.push([r-1,c+1],[r+1,c+1]); } else { list.push([r-1,c-1],[r+1,c-1]); }
  return list.filter(function(p){ return p[0]>=0 && p[1]>=0 && p[1]<rowCols(p[0]); });
}

    shot:null, queue:[], shotsLeft:CFG.shots, shotCount:0,
    aim:null, dragging:false,
    fx:[], falling:[], texts:[], particles:[],
    shake:0, t:0, endTimer:0, result:null, endAlpha:0,
    tutT:0, flash:0, beam:null
  };
  CFG.map.forEach(function(row,r){
    for(var c=0;c<row.length;c++){ var k=row[c]; if(k!=="." && MAP_KEY[k]) G.grid[r+","+c]={type:MAP_KEY[k],r:r,c:c,scale:0,wob:Math.random()*6.28}; }
  });
  G.queue=[nextColor(),nextColor()];
}
function boardColors(){
  var cnt={}; Object.keys(G.grid).forEach(function(k){ var o=G.grid[k]; if(CFG.colors.indexOf(o.type)>=0) cnt[o.type]=(cnt[o.type]||0)+ (o.r>=4?3:1); });
  return cnt;
}
function nextColor(){
  var cnt=boardColors(), keys=Object.keys(cnt); if(!keys.length) return CFG.colors[0];
  var tot=0; keys.forEach(function(k){tot+=cnt[k]}); var x=Math.random()*tot;
  for(var i=0;i<keys.length;i++){ x-=cnt[keys[i]]; if(x<=0) return keys[i]; } return keys[0];
}
function loadShot(){
  G.shotCount++;

  if(type!=="bomb") G.queue.push(nextColor()); else G.queue.length=Math.max(G.queue.length,2);

}

/* ---------- input ---------- */
function toGame(e){ var t=e.touches?e.touches[0]:e; return {x:(t.clientX-view.ox)/view.s,y:(t.clientY-view.oy)/view.s}; }
function onDown(e){
  e.preventDefault(); audioInit();
  var p=toGame(e);
  if(G.state==="end"){ if(G.endAlpha>0.9) endTap(p); return; }
  if(G.shot&&!G.shot.flying){ G.dragging=true; G.aim=p; if(G.state==="tut"){ G.state="play"; } }
}
function onMove(e){ e.preventDefault(); if(G.dragging){ G.aim=toGame(e); } }
function onUp(e){
  e.preventDefault(); if(!G.dragging) return; G.dragging=false;
  var d=aimDir(); if(!d) return;
  fire(d);
}
function aimDir(){
  if(!G.aim||!G.shot) return null;
  var dx=G.aim.x-G.shot.x, dy=G.aim.y-G.shot.y; var len=Math.hypot(dx,dy); if(len<30) return null;
  if(dy>-20) return null;
  var ang=Math.atan2(dy,dx); var lim=-0.12; if(ang>lim) ang=lim; if(ang<-Math.PI-lim) ang=-Math.PI-lim;
  return {x:Math.cos(ang),y:Math.sin(ang)};
}
cv.addEventListener("mousedown",onDown); cv.addEventListener("mousemove",onMove); window.addEventListener("mouseup",onUp);
cv.addEventListener("touchstart",onDown,{passive:false}); cv.addEventListener("touchmove",onMove,{passive:false}); window.addEventListener("touchend",onUp,{passive:false});

/* ---------- shooting / physics ---------- */
var SPEED=1700;
function fire(d){
  G.shot.flying=true; G.shot.vx=d.x*SPEED; G.shot.vy=d.y*SPEED; G.shotsLeft--; SFX.shoot(); G.shot.trail=[];
}
function stepShot(dt){
  var s=G.shot; if(!s||!s.flying) return;
  var steps=Math.ceil(Math.hypot(s.vx,s.vy)*dt/(CFG.R*0.5));
  for(var i=0;i<steps;i++){
    s.x+=s.vx*dt/steps; s.y+=s.vy*dt/steps;
    if(s.x<boardLeft+CFG.R){ s.x=boardLeft+CFG.R; s.vx=-s.vx; SFX.snap(); }
    if(s.x>boardLeft+CFG.cols*CFG.R*2-CFG.R){ s.x=boardLeft+CFG.cols*CFG.R*2-CFG.R; s.vx=-s.vx; SFX.snap(); }
    s.trail.push({x:s.x,y:s.y,a:1}); if(s.trail.length>14) s.trail.shift();
    if(s.y<boardTop+CFG.R){ land(); return; }
    var hit=false, keys=Object.keys(G.grid);
    for(var k=0;k<keys.length;k++){ var o=G.grid[keys[k]]; if(Math.hypot(o.x-s.x,o.y-s.y)<CFG.R*1.75){ hit=true; break; } }
    if(hit){ land(); return; }
  }
}
function nearestEmpty(x,y){
  var best=null,bd=1e9;
  for(var r=0;r<=CFG.deadRow+1;r++) for(var c=0;c<rowCols(r);c++){
    if(G.grid[r+","+c]) continue;
    var d=Math.hypot(cellX(r,c)-x,cellY(r)-y); if(d<bd){bd=d;best=[r,c];}
  }
  return best;
}
function land(){
  var s=G.shot; var cell=nearestEmpty(s.x,s.y); s.flying=false;
  var r=cell[0],c=cell[1];
  var o={type:s.type,r:r,c:c,scale:1,wob:0,x:cellX(r,c),y:cellY(r),squash:1};
  G.grid[r+","+c]=o; G.shot=null;
  resolve(o);
}
function group(o){
  var target=o.type, seen={}, out=[], st=[o];
  seen[o.r+","+o.c]=1;
  while(st.length){ var cur=st.pop(); out.push(cur);
    neighbors(cur.r,cur.c).forEach(function(p){ var k=p[0]+","+p[1]; var n=G.grid[k]; if(!n||seen[k]) return;
      if(n.type===target||n.type==="rainbow"){ seen[k]=1; st.push(n); } });
  }
  return out;
}
function resolve(o){
  var pops=[], triggered=[];
  if(o.type==="bomb"){ explode(o,pops,2); }
  else{
    var g=group(o);
    if(g.length>=CFG.minMatch){ pops=g; }
  }
  if(!pops.length){ o.scale=1; o.squash=0.7; SFX.snap(); afterMove(); return; }
  // specials adjacent to popped cells chain
  var seen={}; pops.forEach(function(p){seen[p.r+","+p.c]=1});
  var i=0;
  while(i<pops.length){ var p=pops[i++];
    neighbors(p.r,p.c).forEach(function(n){ var k=n[0]+","+n[1]; var q=G.grid[k]; if(!q||seen[k]) return;
      if(q.type==="bomb"){ seen[k]=1; pops.push(q); explode(q,pops,2,seen); }
      else if(q.type==="lightning"){ seen[k]=1; pops.push(q); clearRow(q,pops,seen); }
    });
  }
  popCells(pops,o);
}
function explode(center,pops,rad,seen){
  seen=seen||{}; pops.forEach(function(p){seen[p.r+","+p.c]=1});
  if(!seen[center.r+","+center.c]){ pops.push(center); seen[center.r+","+center.c]=1; }
  Object.keys(G.grid).forEach(function(k){ var q=G.grid[k]; if(seen[k]) return;
    if(Math.hypot(q.x-center.x,q.y-center.y)<CFG.R*2*rad+4){ seen[k]=1; pops.push(q); } });
  G.shake=Math.max(G.shake,18); SFX.boom(); G.flash=0.5;
  G.fx.push({kind:"burst",x:center.x,y:center.y,t:0,dur:0.45,size:CFG.R*rad*4.2});
  G.fx.push({kind:"ring",x:center.x,y:center.y,t:0,dur:0.5,size:CFG.R*rad*4.5});
  G.fx.push({kind:"smoke",x:center.x,y:center.y,t:0,dur:0.8,size:CFG.R*rad*3});
}
function clearRow(q,pops,seen){
  for(var c=0;c<rowCols(q.r);c++){ var k=q.r+","+c; var o=G.grid[k]; if(o&&!seen[k]){ seen[k]=1; pops.push(o); } }
  G.beam={y:q.y,t:0}; SFX.zap(); G.shake=Math.max(G.shake,10); G.flash=0.35;
}
function popCells(pops,origin){
  var n=pops.length;
  pops.forEach(function(p,i){
    delete G.grid[p.r+","+p.c];
    var delay=Math.min(0.5,Math.hypot(p.x-origin.x,p.y-origin.y)/900);
    G.fx.push({kind:"pop",type:p.type,x:p.x,y:p.y,t:-delay,dur:0.32,i:i});
  });
  G.combo=(G.combo||0)+1;
  var label = n>=10?"AWESOME!":n>=6?"GREAT!":n>=4?"NICE!":"";
  if(label) G.texts.push({s:label,x:origin.x,y:origin.y-40,t:0,dur:0.9});
  dropFloating();
  afterMove();
}
function dropFloating(){
  var keep={}, st=[];
  for(var c=0;c<CFG.cols;c++){ var o=G.grid["0,"+c]; if(o){ keep["0,"+c]=1; st.push(o); } }
  while(st.length){ var cur=st.pop(); neighbors(cur.r,cur.c).forEach(function(p){ var k=p[0]+","+p[1]; if(G.grid[k]&&!keep[k]){ keep[k]=1; st.push(G.grid[k]); } }); }
  var fell=0;
  Object.keys(G.grid).forEach(function(k){ if(keep[k]) return; var o=G.grid[k]; delete G.grid[k]; fell++;
    G.falling.push({type:o.type,x:o.x,y:o.y,vx:(Math.random()-0.5)*260,vy:-180-Math.random()*120,rot:0,vr:(Math.random()-0.5)*8,t:0}); });
  if(fell>=3) G.texts.push({s:"+"+fell+" DROP!",x:CFG.W/2,y:700,t:0,dur:1,small:true});
}
function afterMove(){
  var remaining=Object.keys(G.grid).length;
  var lowest=0; Object.keys(G.grid).forEach(function(k){ lowest=Math.max(lowest,G.grid[k].r); });
  if(remaining===0){ finish("win"); return; }
  if(lowest>=CFG.deadRow){ finish("fail"); return; }
  if(G.shotsLeft<=0){ finish("fail"); return; }
  setTimeout(function(){ if(G.state!=="end"&&!G.shot) loadShot(); },260);
}
function finish(res){
  if(G.state==="end") return;
  G.state="end"; G.result=res; G.endTimer=0; G.shot=null; gameEnd();
  if(res==="win"){ SFX.win(); for(var i=0;i<40;i++) G.particles.push(confetti()); } else SFX.fail();
}
function confetti(){ return {x:Math.random()*CFG.W,y:-40-Math.random()*400,vx:(Math.random()-0.5)*120,vy:200+Math.random()*250,rot:Math.random()*6,vr:(Math.random()-0.5)*10,col:["#6ec7ff","#ffd75e","#ff6b6b","#b57bff","#7cf58a"][Math.floor(Math.random()*5)],t:0}; }
var restartsUsed=0;
function endTap(p){
  // restart button (fail only, limited)
  if(p.y>1000 && p.y<1080 && Math.abs(p.x-CFG.W/2)<130){ restartsUsed++; newGame(); G.state="play"; loadShot(); return; }
  openStore();
}

/* ---------- update ---------- */
var last=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts; G.t+=dt;
  update(dt); render(); requestAnimationFrame(frame);
}
function update(dt){
  Object.keys(G.grid).forEach(function(k){ var o=G.grid[k]; o.x=cellX(o.r,o.c); o.y=cellY(o.r);
    if(o.scale<1) o.scale=Math.min(1,o.scale+dt*3); if(o.squash!==undefined&&o.squash<1) o.squash=Math.min(1,o.squash+dt*5); o.wob+=dt*1.5; });
  if(G.shot){ if(G.shot.scale<1) G.shot.scale=Math.min(1,G.shot.scale+dt*5); stepShot(dt); if(G.shot&&G.shot.trail) G.shot.trail.forEach(function(t){t.a-=dt*4}); }
  G.fx=G.fx.filter(function(f){ f.t+=dt; return f.t<f.dur; });
  G.texts=G.texts.filter(function(f){ f.t+=dt; return f.t<f.dur; });
  G.falling=G.falling.filter(function(f){ f.t+=dt; f.vy+=1800*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.rot+=f.vr*dt; return f.y<CFG.H+100; });
  G.particles=G.particles.filter(function(p){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; return p.y<CFG.H+40; });
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*60);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt*2);
  if(G.beam){ G.beam.t+=dt; if(G.beam.t>0.35) G.beam=null; }
  G.tutT+=dt;
  if(G.state==="end"){ G.endTimer+=dt; G.endAlpha=Math.min(1,Math.max(0,(G.endTimer-0.6)*2)); }
}

/* ---------- render ---------- */

      ctx.save(); ctx.translate(r+segW/2-2,y+h/2); ctx.rotate(-Math.PI/2); ctx.drawImage(strip,0,0,strip.width*h/segH,strip.height,-h/2,-segW/2,h,segW); ctx.restore();

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function orbImg(type){ return CFG.colors.indexOf(type)>=0 ? "orb_"+type : "sp_"+type; }
function drawOrb(type,x,y,scale,rot,alpha){

function drawHUD(){
  drawImg("logo",125,92,210);
  // shots bar
  var bx=CFG.W/2+70, by=92, bw=280;
  drawImg("bar",bx,by,bw);
  var im=IMG.bar; if(im&&im.width){ var bh=bw*im.height/im.width; var frac=Math.max(0,G.shotsLeft/CFG.shots);
    ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle=frac>0.3?"#5fc7ff":"#ff7a7a"; roundRect(bx-bw/2+14,by-bh*0.28,(bw-28)*frac,bh*0.56,8); ctx.fill(); ctx.restore(); }
  ctx.font="bold 24px Arial"; ctx.textAlign="center"; ctx.lineWidth=5; ctx.strokeStyle="#2b1a4d"; ctx.fillStyle="#fff";
  var lbl=G.shotsLeft+(G.shotsLeft===1?" SHOT":" SHOTS"); ctx.strokeText(lbl,bx,by+9); ctx.fillText(lbl,bx,by+9);
}
function drawTutorial(){
  var p=(G.tutT%1.6)/1.6, sy=1120, tx=CFG.W/2+Math.sin(p*6.28)*90, ty=sy-60-Math.abs(Math.sin(p*3.14))*60;
  ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.strokeStyle="rgba(140,230,255,0.6)"; ctx.lineWidth=4; ctx.setLineDash([8,10]); ctx.beginPath(); ctx.moveTo(CFG.W/2,sy); ctx.lineTo(tx,ty-200); ctx.stroke(); ctx.restore();
  drawImg("hand",tx+20,ty+40,120,undefined,0,0.95);
  var pulse=1+0.05*Math.sin(G.t*5);
  ctx.save(); ctx.translate(CFG.W/2,560); ctx.scale(pulse,pulse); ctx.font="900 54px Arial"; ctx.textAlign="center"; ctx.lineWidth=10; ctx.strokeStyle="#2b1a4d"; ctx.strokeText(CFG.tutText,0,0); ctx.fillStyle="#fff"; ctx.fillText(CFG.tutText,0,0); ctx.restore();
}
function drawEnd(){
  var a=G.endAlpha; if(a<=0) return;
  ctx.save(); ctx.globalAlpha=a*0.72; ctx.fillStyle="#120f2a"; ctx.fillRect(-200,-200,CFG.W+400,CFG.H+400); ctx.restore();
  ctx.save(); ctx.globalAlpha=a; var sc=easeOutBack(a);
  ctx.translate(CFG.W/2,0); ctx.scale(sc,sc);
  drawImg("logo",0,330,540);
  ctx.font="900 76px Arial"; ctx.textAlign="center"; ctx.lineWidth=12; ctx.strokeStyle="#2b1a4d"; ctx.strokeText(G.result==="win"?CFG.winText:CFG.failText,0,590); ctx.fillStyle=G.result==="win"?"#ffe66d":"#ffffff"; ctx.fillText(G.result==="win"?CFG.winText:CFG.failText,0,590);
  drawImg("icon",0,760,180);
  var pulse=1+0.05*Math.sin(G.t*5);
  ctx.save(); ctx.translate(0,920); ctx.scale(pulse,pulse); drawImg("cta_big",0,0,520); ctx.restore();
  drawImg("cta_again",0,1050,330);
  ctx.restore();
}
